[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-subagent-router"
version = "0.1.0"
description = "Explicit external runtime invocation and evidence boundaries"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
subagent = "agent_subagent_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["native: installed CLI against a local fake upstream only",
           "containment: synthetic adversarial probes in pinned Docker image"]

[tool.ruff]
line-length = 100
target-version = "py311"
